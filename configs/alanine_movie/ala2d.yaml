# Alanine (phi, psi) movie runs: ONE seed, snapshots every 50 steps (0.05 ps); histogram c800 / 5 ps ramp;
# FR torus-uniform from 0.5 ps at rate 0.15 (the visible dose).  docs/ALANINE_MOVIES.md
experiment_name: alanine_movie_2d
output_root: results/alanine_movie/ala2d
reference: results/alanine/reference/reference.npz
stage: abf
base:
  dt: 0.001
  gamma: 1.0
  temperature: 300.0
  save_every: 1000
  rng_seed: 20260903
  init_equil_ps: 20.0
  n_grid: 97
  abf_estimator: histogram
  abf_hist_levels: 4
  abf_hist_fixed: false
  abf_bandwidth: 0.08
  kde_bandwidth: 0.15
  abf_min_count: 800.0
  abf_force_clip: 200.0
  project_every: 50
  estimator_stride: 1
  abf_warmup_steps: 5000
  fr_start_steps: 0
  fr_every: 500
  fr_rate: 0.15
  score_clip: 2.0
  max_event_fraction: 0.05
  lineage_reset_steps: 6000
  store_snapshots: 50
  snapshot_seed_index: 0
  n_steps: 100000
  n_replicas: 2048
stages:
  abf:
    methods:
    - abf
    seeds:
    - 0
    init: c7eq
    init_seed: 4242
    overrides: {}
  fr:
    methods:
    - fr_uniform
    seeds:
    - 0
    init: c7eq
    init_seed: 4242
    overrides:
      fr_rate: 0.15
