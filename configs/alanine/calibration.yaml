# FR-rate SAFETY calibration (oracle only). Selection is by genealogy/event safety ONLY --
# FES error is deliberately NOT inspected when choosing the rate.
experiment_name: alanine_fr_calibration
output_root: results/alanine_oracle/calibration
reference: results/alanine/reference/reference.npz
stage: rate_lo
base:
  dt: 0.001
  gamma: 1.0
  temperature: 300.0
  n_replicas: 2048
  save_every: 1000
  rng_seed: 20260902
  init_equil_ps: 20.0
  n_grid: 97
  abf_bandwidth: 0.08
  kde_bandwidth: 0.15
  abf_min_count: 200.0
  abf_force_clip: 200.0
  project_every: 50
  estimator_stride: 1
  abf_warmup_steps: 5000
  fr_start_steps: 20000
  fr_every: 500
  score_clip: 2.0
  max_event_fraction: 0.05
  lineage_reset_steps: 6000
  n_steps: 30000
stages:
  rate_lo:   {methods: [fr_oracle], seeds: [0, 1], init: c7eq, init_seed: 4242, overrides: {fr_rate: 0.02}}
  rate_mid:  {methods: [fr_oracle], seeds: [0, 1], init: c7eq, init_seed: 4242, overrides: {fr_rate: 0.05}}
  rate_hi:   {methods: [fr_oracle], seeds: [0, 1], init: c7eq, init_seed: 4242, overrides: {fr_rate: 0.10}}
