# Stage S2 tiny GPU smoke -- NOT scientific. Stored separately from pilot/production.
experiment_name: alanine_oracle_smoke
output_root: results/alanine_oracle/smoke
reference: results/alanine/reference/reference.npz
stage: smoke
base:
  # frozen physical model (identical to the accepted reference)
  dt: 0.001
  gamma: 1.0
  temperature: 300.0
  n_replicas: 128
  save_every: 500
  rng_seed: 20260901
  init_equil_ps: 2.0
  # frozen shared estimator settings
  n_grid: 97
  abf_bandwidth: 0.08
  kde_bandwidth: 0.15
  abf_min_count: 200.0
  abf_force_clip: 200.0
  project_every: 50
  estimator_stride: 1
  abf_warmup_steps: 1000
  # FR (accelerated start for the smoke only, to exercise the replacement path)
  fr_start_steps: 1000
  fr_every: 500
  fr_rate: 0.05
  score_clip: 2.0
  max_event_fraction: 0.05
  lineage_reset_steps: 6000
  n_steps: 5000
stages:
  smoke:
    methods: [abf, fr_oracle]
    seeds: [0, 1]
    init: c7eq
    init_seed: 909
