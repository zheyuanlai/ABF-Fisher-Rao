# Preregistered ABF vs oracle-mFR pilot. FR rate is filled in from the SAFETY calibration
# (selected on genealogy/event criteria only, never on FES error) before this is run.
experiment_name: alanine_oracle_pilot
output_root: results/alanine_oracle/pilot
reference: results/alanine/reference/reference.npz
stage: N2048
base:
  dt: 0.001
  gamma: 1.0
  temperature: 300.0
  save_every: 1000
  rng_seed: 20260903
  init_equil_ps: 20.0
  n_grid: 97
  abf_bandwidth: 0.08
  kde_bandwidth: 0.15
  abf_min_count: 200.0
  abf_force_clip: 200.0
  project_every: 50
  estimator_stride: 1
  abf_warmup_steps: 5000
  fr_start_steps: 20000        # 20 ps
  fr_every: 500                # 0.5 ps
  fr_rate: FR_RATE_PLACEHOLDER
  score_clip: 2.0
  max_event_fraction: 0.05
  lineage_reset_steps: 6000    # 6 ps age-aware window
  n_steps: 100000              # 100 ps
  n_replicas: 2048
stages:
  N2048:
    methods: [abf, fr_oracle]
    seeds: [0, 1, 2, 3]
    init: c7eq
    init_seed: 4242
  N4096:
    methods: [abf, fr_oracle]
    seeds: [10, 11, 12, 13]
    init: c7eq
    init_seed: 8484
    overrides: {n_replicas: 4096}
  N2048_refeq:
    methods: [abf, fr_oracle]
    seeds: [20, 21, 22, 23]
    init: reference_equilibrium
    init_seed: 1717
