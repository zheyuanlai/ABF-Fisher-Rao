# Clean-v2 Stage 0: engineering gates only.  NOT scientific data.
# Frozen protocol: docs/CLEAN_V2_PREREGISTRATION.md
experiment_name: clean_v2_stage0_gates
output_root: results/clean_v2/stage0_gates
backend: torch
device: cpu
dtype: float64
batch_size_configs: 4

clean_v2:
  enabled: true

selection:
  write_generic_best: false

potential:
  x_tilt: 0.1021665783

domain:
  x_min: -3.0
  x_max: 3.0
  y_min: -2.5
  y_max: 3.5
  nx_ref: 401
  ny_ref: 401
  nx_profile: 201

simulation:
  beta: 4.0
  dt: 0.002
  n_particles: 64
  n_steps: 1000
  eval_every: 100
  seeds: [0, 1]
  x_init_mode: uniform
  y_init_mode: uniform

abf:
  estimator: binned_smooth
  observation_order: post_propagation
  h: 0.05
  update_every: 10
  min_count: 1.0

fr:
  enabled: true
  target_types: [physical, physical_oracle]
  gamma_values: [0.0, 0.05]
  eta_values: [0.10]
  burnin_fractions: [0.20]
  duration_fractions: [0.60]
  fr_every_values: [100]
  interval_scaled_clock: true
  noise_chunk_steps: 256

methods:
  - abf_only
  - abf_fr_physical
  - abf_fr_physical_oracle
