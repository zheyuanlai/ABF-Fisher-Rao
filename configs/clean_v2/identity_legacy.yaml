# Clean-v2 engineering artifact, NOT scientific data.
# The SAME plain-ABF arm under a LEGACY v2 config that still carries
# abf.ema_alpha, fr.score_clip and fr.max_event_fraction.  It has no
# clean_v2 block ON PURPOSE and is run with run_abf_fr_grid_torch.py:
# run_clean_v2.py would (correctly) refuse it.  Its job is to show that
# removing those keys changed the FR TARGET and not the ABF ESTIMATOR.
experiment_name: clean_v2_identity_legacy
output_root: results/clean_v2/identity/legacy
backend: torch
device: cuda
dtype: float64
batch_size_configs: 4
selection:
  write_generic_best: false
potential:
  x_tilt: 0.1021665783
domain:
  x_min: -3.0
  x_max: 3.0
  y_min: -2.5
  y_max: 3.5
  nx_ref: 801
  ny_ref: 801
  nx_profile: 401
simulation:
  beta: 4.0
  dt: 0.002
  n_particles: 256
  n_steps: 50000
  eval_every: 500
  seeds:
  - 1000
  - 1001
  x_init_mode: uniform
  y_init_mode: uniform
abf:
  estimator: binned_smooth
  observation_order: post_propagation
  h: 0.05
  update_every: 10
  min_count: 1.0
  ema_alpha: 0.05
fr:
  enabled: false
  target_types:
  - physical
  gamma_values: []
  eta_values:
  - 0.1
  burnin_fractions:
  - 0.2
  duration_fractions:
  - 0.6
  fr_every_values:
  - 500
  interval_scaled_clock: true
  noise_chunk_steps: 1000
  score_clip: 5.0
  max_event_fraction: 0.1
  target_ema_alpha: 0.05
  ramp_fraction: 0.0
  jitter: 0.0
methods:
- abf_only
