# Mechanism-only dose calibration for the oracle information target.
# Selection may read pulse mechanics and predicted information risk, but no
# free-energy or mean-force error outcome.
experiment_name: information_target_dose_calibration
output_root: results/information_target/stage0_dose_calibration
backend: torch
device: cuda
dtype: float64
batch_size_configs: 24

information_target:
  enabled: true
  kind: dose_calibration
  n_cells: 32
  report_min: -2.5
  report_max: 2.5
  min_expected_particles_per_cell: 1.0
  expected_firing_steps: [10000]

selection:
  write_generic_best: false

potential:
  x_tilt: 0.1021665783

domain:
  x_min: -3.0
  x_max: 3.0
  y_min: -2.5
  y_max: 3.5
  nx_ref: 801
  ny_ref: 801
  nx_profile: 401

simulation:
  beta: 4.0
  dt: 0.002
  n_particles: 256
  n_steps: 11000
  eval_every: 500
  seeds: [6000, 6001, 6002, 6003, 6004, 6005, 6006, 6007]
  x_init_mode: uniform
  y_init_mode: uniform

abf:
  estimator: binned_smooth
  observation_order: post_propagation
  h: 0.05
  update_every: 10
  min_count: 1.0

fr:
  enabled: true
  target_types: [information_oracle]
  gamma_values: [0.001, 0.002, 0.004, 0.008, 0.016, 0.032]
  eta_values: [0.10]
  burnin_fractions: [0.9090909090909091]
  duration_fractions: [0.045454545454545456]
  fr_every_values: [500]
  interval_scaled_clock: true
  noise_chunk_steps: 1000

methods:
  - abf_fr_information_oracle
