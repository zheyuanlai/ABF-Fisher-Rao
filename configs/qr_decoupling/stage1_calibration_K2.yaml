# q-r Stage 1: plain-ABF calibration on kappa cell K2.
# Products: the frozen accuracy thresholds, and the Gamma_hat validation that
# can stop the campaign before any allocation arm runs.
# Frozen protocol: docs/QR_DECOUPLING_PREREGISTRATION.md
experiment_name: qr_stage1_calibration_K2
output_root: results/qr_decoupling/stage1_calibration/K2
backend: torch
device: cuda
dtype: float64
batch_size_configs: 16

selection:
  write_generic_best: false

potential:
  x_tilt: 0.1021665783

domain:
  x_min: -3.0
  x_max: 3.0
  y_min: -2.5
  y_max: 3.5
  nx_ref: 801
  ny_ref: 801
  nx_profile: 401

kappa:
  cell: K2

simulation:
  beta: 4.0
  dt: 0.002
  n_particles: 256
  n_steps: 50000
  eval_every: 500
  seeds: [5100, 5101, 5102, 5103, 5104, 5105, 5106, 5107,
          5108, 5109, 5110, 5111, 5112, 5113, 5114, 5115]
  x_init_mode: uniform
  y_init_mode: uniform

abf:
  estimator: binned_smooth
  observation_order: post_propagation
  h: 0.05
  update_every: 10
  min_count: 1.0

fr:
  enabled: false
