# Stage-0 smoke for the CV extension: pipeline/correctness check (tiny, fast). Not evidence.
experiment_name: alkanes_cv_smoke
output_root: results/alkanes_cv_extension/smoke
cache_dir: cache/alkanes_cv

base:
  save_every: 500
  abf_force_clip: 60.0
  force_clip: 200.0
  dt: 5.0e-4
  ref_n_samples: 60000

method_defaults:
  target_ema_rate: 0.01
  max_event_fraction: 0.02
  fr_every: 5
  score_clip: 2.0

methods:
  abf:          {type: abf}
  fr_estimated: {type: fr_estimated, fr_rate: 0.10, fr_start_steps: 600, target_ema_rate: 0.02}
  fr_uniform:   {type: fr_uniform,   fr_rate: 0.10, fr_start_steps: 600}
  fr_oracle:    {type: fr_oracle,    fr_rate: 0.10, fr_start_steps: 600}
  opes:         {type: opes, opes_barrier: 8.0, opes_pace: 200, opes_sigma: 0.25}

stages:
  smoke:
    seeds: [0, 1]
    rng_seed: 20260719
    methods: [abf, fr_estimated, fr_uniform, fr_oracle, opes]
    cells:
      # R15 distance CV (pentane)
      - {kind: dist, molecule: pentane, beta: 1.0, sigma: 2.3, cv_i: 0, cv_j: 4,
         R_lo: 1.4, R_hi: 3.7, wall_lo: 1.45, wall_hi: 3.65, dist_n_grid: 128,
         init_mode: trans, n_steps: 1500, n_replicas: 128, n_rbins: 10, n_grid2: 32,
         abf_warmup_steps: 300, estimator_burn_in_steps: 400, fr_start_steps: 600}
      # 2-D torsion CV (pentane)
      - {kind: joint2d, molecule: pentane, beta: 1.0, sigma: 2.3, grid2d: 24,
         init_mode: dispersed, n_steps: 1200, n_replicas: 128,
         abf_warmup_steps: 300, estimator_burn_in_steps: 400, fr_start_steps: 600}
