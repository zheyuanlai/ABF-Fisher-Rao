# RETIRED 2026-08-26 -- v3 is closed; see docs/CLEAN_V2_PREREGISTRATION.md.
# The clean-v2 engine refuses any config carrying a "v3:" block.  Kept as the
# record of a negative result, not as a runnable arm.
# v3 threshold stage: plain ABF only (docs/V3_PREREGISTRATION.md, Amendment 5).
# No FR arm may appear here; the threshold freezer refuses a mixed input.
experiment_name: v3_plain_abf
output_root: results/v3/plain_abf
backend: torch
device: cuda
dtype: float64
batch_size_configs: 8

selection:
  write_generic_best: false

potential:
  x_tilt: 0.1021665783

domain:
  x_min: -3.0
  x_max: 3.0
  y_min: -2.5
  y_max: 3.5
  nx_ref: 801
  ny_ref: 801
  nx_profile: 401

simulation:
  beta: 4.0
  dt: 0.002
  n_particles: 256
  n_steps: 50000
  eval_every: 500
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  x_init_mode: uniform
  y_init_mode: uniform

abf:
  estimator: binned_smooth
  observation_order: post_propagation
  h: 0.05
  update_every: 10
  min_count: 1.0
  ema_alpha: 0.05

fr:
  enabled: false
  target_types: []
  gamma_values: [0.0]
  eta_values: [0.10]
  burnin_fractions: [0.0]
  duration_fractions: [1.0]
  ramp_fraction: 0.0
  fr_every_values: [1]
  noise_chunk_steps: 1000

methods:
  - abf_only
