[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abpfr"
version = "0.1.0"
description = "Adaptive Biasing Potential (mollified SHUS) with temporary marginal Fisher-Rao resampling"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
